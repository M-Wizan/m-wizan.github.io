<div class="music-player">

  <iframe
    id="music-frame"
    width="100%"
    height="400"
    src=""
    title="Music Player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <h3 id="music-title" style="margin-top:1rem;"></h3>
  <p id="music-group" style="margin-top:-0.5rem;color:#777;"></p>

  <div style="margin-top:1rem;">
    <button onclick="previousSong()">⏮ Previous</button>
    <button onclick="randomSong()">🎲 Random</button>
    <button onclick="nextSong()">⏭ Next</button>
  </div>

</div>

<script src="{{ '/assets/js/music-player.js' | relative_url }}"></script>

<script>
let playlist = [];
let current = -1;

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function loadSong(i) {

    current = i;

    document.getElementById("music-frame").src =
        "https://www.youtube.com/embed/" + playlist[i].id;

    document.getElementById("music-title").textContent =
        playlist[i].title;

    document.getElementById("music-group").textContent =
        playlist[i].group;
}

function nextSong(){

    current++;

    if(current >= playlist.length){
        shuffle(playlist);
        current = 0;
    }

    loadSong(current);
}

function previousSong(){

    current--;

    if(current < 0)
        current = playlist.length-1;

    loadSong(current);
}

function randomSong(){

    let r;

    do{
        r = Math.floor(Math.random()*playlist.length);
    } while(r === current && playlist.length > 1);

    loadSong(r);
}

window.onload = function(){

    playlist = [...songs];

    shuffle(playlist);

    loadSong(0);

};
</script>
